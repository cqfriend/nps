<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="page-clientlist"></h5>

                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
            <div class="content">
            {{if eq true .isAdmin}}

                <div class="table-responsive">
                    <div id="toolbar">
                        <a href="{{.web_base_url}}/client/add" class="btn btn-primary dim">
                        <i class="fa fa-fw fa-lg fa-plus"></i> <span langtag="word-add"></span></a>
                        <a href="#" data-toggle="modal" data-target="#batchAddModal" class="btn btn-info dim">
                        <i class="fa fa-fw fa-lg fa-file-import"></i> <span langtag="word-batchadd"></span></a>
                        <a href="#" onclick="batchDelete('{{.web_base_url}}/client/del');return false;" class="btn btn-danger dim">
                        <i class="fa fa-fw fa-lg fa-trash"></i> <span langtag="word-batchdelete"></span></a>
                    </div>
                    <table id="taskList_table" class="table-striped table-hover" data-mobile-responsive="true"></table>
                </div>
            </div>
            {{end}}
                <div class="ibox-content">

                    <table id="table"></table>

                </div>
            </div>
        </div>
    </div>
</div>

{{if eq true .isAdmin}}
<div class="modal inmodal fade" id="batchAddModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="padding: 15px;">
                <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
                <h4 class="modal-title"><i class="fa fa-file-import"></i> <span langtag="word-batchadd"></span></h4>
            </div>
            <div class="modal-body" style="padding: 20px 25px;">
                <div class="alert alert-info" style="font-size: 13px; line-height: 1.6; margin-bottom: 15px;">
                    <strong><i class="fa fa-info-circle"></i> <span langtag="word-importformat"></span>：</strong><br>
                    1. 每行一条记录，字段按英文逗号 <code>,</code> 分隔（兼容 Tab 制表符）。<br>
                    2. <strong>主要字段顺序</strong>：<code>备注, Basic认证用户名, Basic认证密码, 唯一验证密钥</code><br>
                    &emsp;选填项（流量/连接限制）：<code>流量限制(M), 带宽限制(KB/s), 最大连接数, 最大隧道数</code><br>
                    3. <strong>简易模式</strong>：仅填写 <code>备注</code> 或 <code>备注,用户名,密码</code> 即可；密钥留空将由系统自动生成随机密钥。<br>
                    4. 首行若是表头（含“备注”或“remark”）将自动忽略；以 <code>#</code> 开头的行为注释。
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <div class="row">
                        <div class="col-sm-7">
                            <label class="control-label font-bold">导入本地文件 (.txt / .csv)：</label>
                            <input type="file" id="batch_file_input" accept=".txt,.csv" class="form-control" style="padding: 4px; height: auto;">
                        </div>
                        <div class="col-sm-5 text-right" style="padding-top: 24px;">
                            <button type="button" class="btn btn-default btn-sm" onclick="fillBatchExample()"><i class="fa fa-magic"></i> <span langtag="word-fillexample"></span></button>
                            <button type="button" class="btn btn-default btn-sm" onclick="$('#batch_content').val('')"><i class="fa fa-eraser"></i> 清空</button>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 5px;">
                    <label class="control-label font-bold">导入数据内容：</label>
                    <textarea class="form-control" id="batch_content" rows="9" placeholder="备注,Basic认证用户名,Basic认证密码,唯一验证密钥&#10;client-01,admin,123456,custom_vkey_888&#10;client-02,testuser,pwd123456&#10;client-03" style="font-family: monospace; font-size: 13px; resize: vertical;"></textarea>
                </div>

                <div id="batch_result_box" style="display: none; margin-top: 15px;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-white" data-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="btn_do_batch_add" onclick="submitBatchAdd()"><i class="fa fa-check"></i> <span langtag="word-batchimport"></span></button>
            </div>
        </div>
    </div>
</div>
{{end}}

<script>
    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50],//分页步进值
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang ('#table'); },
        detailFormatter: function (index, row, element) {
            return '<b langtag="word-maxconnections"></b>: ' + row.MaxConn + '&emsp;'
                + '<b langtag="word-curconnections"></b>: ' + row.NowConn + '&emsp;'
                + '<b langtag="word-flowlimit"></b>: ' + row.Flow.FlowLimit + 'm&emsp;'
                + '<b langtag="word-ratelimit"></b>: ' + row.RateLimit + 'KB/s&emsp;'
                + '<b langtag="word-maxtunnels"></b>: ' + row.MaxTunnelNum + '&emsp;<br/><br/>'
                + '<b langtag="word-webusername"></b>: ' + row.WebUserName + '&emsp;'
                + '<b langtag="word-webpassword"></b>: ' + row.WebPassword + '&emsp;'
                + '<b langtag="word-basicusername"></b>: ' + row.Cnf.U + '&emsp;'
                + '<b langtag="word-basicpassword"></b>: ' + row.Cnf.P + '&emsp;<br/><br/>'
                + '<b langtag="word-connectbyconfig"></b>: <span langtag="word-' + row.ConfigConnAllow + '"></span>&emsp;<br/><br/>'
                + '<b langtag="word-ipwhite"></b>: ' + row.IpWhite + '&emsp;'
                + '<b langtag="word-ipwhitepass"></b>: ' + row.IpWhitePass + '&emsp;<br/>'
                + '<b langtag="word-ipwhitelist"></b>: ' + row.IpWhiteList + '&emsp;<br/>'
                + '<b langtag="word-blackip"></b>: ' + row.BlackIpList + '&emsp;<br/><br/>'
                + '<b langtag="word-createtime"></b>: ' + row.CreateTime + '&emsp;<br/>'
                + '<b langtag="word-lastonlinetime"></b>: ' + row.LastOnlineTime + '&emsp;<br/>'
                + '<b langtag="word-expiretime"></b>: ' + (row.ExpireTime || '<span langtag="info-unrestricted"></span>') + '&emsp;<br/><br/>'
                + '<b langtag="word-quicklycommand"></b>: <span>' + encodeToBase64(row.Remark +'|'+'{{.ip}}:{{.p}}|' + row.VerifyKey + '|false')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="">复制</button><br/>'
                + '<b langtag="word-tlsquicklycommand"></b>: <span>' + encodeToBase64(row.Remark +'|'+'{{.ip}}:{{.tls_p}}|' + row.VerifyKey + '|true')   + '</span>&emsp;<button class="copy btn btn-info btn-xs" onclick="copyCommand(this)" data-clipboard-text="">复制</button><br/>'
                + '<b langtag="word-commandclient"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.p}} -vkey=" + row.VerifyKey + " -type=" +{{.bridgeType}} +"</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\">复制</button><br/>"
                + '<b langtag="word-commandclient-tls"></b>: ' + "<code>{{.win}} -server={{.ip}}:{{.tls_p}} -vkey=" + row.VerifyKey + " -tls_enable=true</code><button class=\"copy btn btn-info btn-xs\" onclick=\"copyCommand(this)\" data-clipboard-text=\"\">复制</button>"
        },
        //表格的列
        columns: [
            {
                checkbox: true,
                align: 'center',
                valign: 'middle'
            },
            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return value
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'LocalAddr',//域值
                title: '<span langtag="word-localaddr"></span>',//标题
                halign: 'center',
                sortable: true,
                visible: true//false表示不显示
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.InletFlow)
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return changeunit(row.Flow.ExportFlow)
                }
            },
            {
                field: 'NowRate',//域值
                title: '<span langtag="word-speed"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    return changeunit(row.Rate.NowRate) + "/S"
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-online"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    btn_group += '<a onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                    btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-success"><i class="fa fa-edit"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show">',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<div class="btn-group"><a href="{{.web_base_url}}/index/all?client_id=' + row.Id
                        + '" class="btn btn-outline btn-primary" langtag="word-tunnel"></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + row.Id
                        + '" class="btn btn-outline btn-success" langtag="word-host"></a></div>'
                }
            }
        ]
    });

    function encodeToBase64(str){
        const utf8Str = unescape(encodeURIComponent("nps:"+str));
        return btoa(utf8Str);
    }

    function copyCommand(data) {
        data.setAttribute("data-clipboard-text", data.previousElementSibling.innerHTML)
    }

    var clipboard = new ClipboardJS('.copy');
    clipboard.on('success', function (e) {
        // alert("复制成功"+e.text)
        toastr.success('复制成功');
        e.clearSelection();
    });

    clipboard.on('error', function (e) {
        // alert("复制失败")
        toastr.error('复制失败', '提示');
    });

    $('#batch_file_input').on('change', function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (evt) {
            $('#batch_content').val(evt.target.result);
        };
        reader.readAsText(file, 'UTF-8');
    });

    function fillBatchExample() {
        var example = "# 备注,Basic认证用户名,Basic认证密码,唯一验证密钥\n" +
            "client-01,admin,123456,custom_vkey_888\n" +
            "client-02,testuser,pwd123456\n" +
            "client-03";
        $('#batch_content').val(example);
    }

    function submitBatchAdd() {
        var content = $('#batch_content').val();
        if (!content || $.trim(content) === '') {
            toastr.warning('请先输入或选择要导入的内容');
            return;
        }
        var btn = $('#btn_do_batch_add');
        btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> 导入中...');
        $('#batch_result_box').hide().empty();

        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/client/batchadd",
            data: { content: content },
            dataType: "json",
            success: function (res) {
                btn.prop('disabled', false).html('<i class="fa fa-check"></i> <span langtag="word-batchimport">导入</span>');
                if (res.code === 1) {
                    var d = res.data || {};
                    var alertClass = d.fail > 0 ? 'alert-warning' : 'alert-success';
                    var html = '<div class="alert ' + alertClass + '"><strong>' + res.msg + '</strong>';
                    if (d.errors && d.errors.length > 0) {
                        html += '<ul style="margin-top: 5px; margin-bottom: 0; padding-left: 20px;">';
                        for (var i = 0; i < d.errors.length; i++) {
                            html += '<li>' + d.errors[i] + '</li>';
                        }
                        html += '</ul>';
                    }
                    html += '</div>';
                    $('#batch_result_box').html(html).show();
                    toastr.success(res.msg);
                    $('#table').bootstrapTable('refresh');
                    if (d.fail === 0) {
                        setTimeout(function () {
                            $('#batchAddModal').modal('hide');
                            $('#batch_content').val('');
                            $('#batch_result_box').hide().empty();
                        }, 1200);
                    }
                } else {
                    toastr.error(res.msg || '导入失败');
                    $('#batch_result_box').html('<div class="alert alert-danger">' + (res.msg || '导入失败') + '</div>').show();
                }
            },
            error: function () {
                btn.prop('disabled', false).html('<i class="fa fa-check"></i> <span langtag="word-batchimport">导入</span>');
                toastr.error('网络请求异常，请稍后重试');
            }
        });
    }

    $('#batchAddModal').on('shown.bs.modal', function () {
        $('body').setLang('#batchAddModal');
    });

</script>
